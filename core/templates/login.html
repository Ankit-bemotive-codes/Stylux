{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login | Stylux</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">
	<link rel="stylesheet" href="{% static 'css/login.css' %}?v=1">
</head>
<body>
	<main class="login-page">
		<section class="login-card">
			<a class="login-brand d-block mb-4" href="{% url 'home' %}">sty<span>lux</span></a>
			<div class="login-label mb-2">Welcome back</div>
			<h1 class="h2 mb-2">Sign in to your account</h1>
			<p class="text-muted mb-4">Access saved addresses and a smoother checkout.</p>

			{% if form.errors %}
				<div class="login-error mb-3" role="alert">Your username or password was not recognised.</div>
			{% endif %}

			<form method="post">
				{% csrf_token %}
				{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
				<div class="mb-3">
					<label class="form-label" for="id_username">Username</label>
					<input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
				</div>
				<div class="mb-4">
					<label class="form-label" for="id_password">Password</label>
					<input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
				</div>
				<button class="btn-shop btn-shop-primary w-100" type="submit">Login</button>
			</form>

			<a class="d-block text-center mt-3" href="{% url 'home' %}">Continue browsing</a>
		</section>
	</main>
</body>
</html>
